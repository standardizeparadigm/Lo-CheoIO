<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lọ Chéo favicon — a slanted pickled jar with gold lid">
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3030"/>
      <stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.45" stop-color="#f3e3c8"/>
      <stop offset="1" stop-color="#cbb191"/>
    </linearGradient>
    <radialGradient id="brine" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#1a443c"/>
      <stop offset="1" stop-color="#0d2620"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#tileBg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#f5a81c" stroke-opacity="0.35" stroke-width="6"/>

  <!-- slanted jar -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="12 256 256;20 256 256;12 256 256" keyTimes="0;0.5;1"
      dur="3.6s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      repeatCount="indefinite"/>
    <!-- ceramic body -->
    <rect x="106" y="150" width="300" height="262" rx="78" fill="url(#body)"/>
    <rect x="313" y="150" width="93" height="262" rx="70" fill="#a08060" opacity="0.35"/>
    <!-- brine window -->
    <rect x="140" y="253" width="232" height="140" rx="46" fill="url(#brine)" stroke="#d6b88c" stroke-width="6"/>
    <!-- pickles -->
    <ellipse cx="200" cy="330" rx="26" ry="56" fill="#8cc63f" stroke="#5a8c28" stroke-width="5" transform="rotate(-28 200 330)"/>
    <ellipse cx="264" cy="362" rx="22" ry="50" fill="#a8d65c" stroke="#649632" stroke-width="5" transform="rotate(14 264 362)"/>
    <ellipse cx="322" cy="318" rx="20" ry="44" fill="#8cc63f" stroke="#5a8c28" stroke-width="5" transform="rotate(-12 322 318)"/>
    <!-- fiery chili -->
    <ellipse cx="212" cy="372" rx="52" ry="20" fill="#e63b2e" transform="rotate(-14 212 372)"/>
    <ellipse cx="252" cy="378" rx="18" ry="12" fill="#ff6a4d" transform="rotate(-14 252 378)"/>
    <!-- golden salt pearl -->
    <circle cx="336" cy="372" r="15" fill="#ffd766" stroke="#b8770e" stroke-width="4">
      <animate attributeName="r" values="15;17.5;15" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- ridged gold lid -->
    <rect x="100" y="136" width="312" height="56" rx="18" fill="#f5a81c" stroke="#b8770e" stroke-width="5"/>
    <line x1="134" y1="140" x2="134" y2="188" stroke="#b8770e" stroke-width="5"/>
    <line x1="169" y1="140" x2="169" y2="188" stroke="#b8770e" stroke-width="5"/>
    <line x1="203" y1="140" x2="203" y2="188" stroke="#b8770e" stroke-width="5"/>
    <line x1="238" y1="140" x2="238" y2="188" stroke="#b8770e" stroke-width="5"/>
    <line x1="272" y1="140" x2="272" y2="188" stroke="#b8770e" stroke-width="5"/>
    <line x1="307" y1="140" x2="307" y2="188" stroke="#b8770e" stroke-width="5"/>
    <line x1="341" y1="140" x2="341" y2="188" stroke="#b8770e" stroke-width="5"/>
    <line x1="376" y1="140" x2="376" y2="188" stroke="#b8770e" stroke-width="5"/>
    <!-- lid knob -->
    <rect x="210" y="108" width="92" height="34" rx="14" fill="#ffc94a" stroke="#b8770e" stroke-width="5"/>
    <!-- ceramic highlight -->
    <path d="M 132 222 A 200 200 0 0 0 132 356" fill="none" stroke="#fffdf4" stroke-opacity="0.75" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <path d="M428 52 L438.5 85 L472 96 L438.5 107 L428 140 L417.5 107 L384 96 L417.5 85 Z" fill="#ffd766">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M96 104 L103.4 125.6 L125 133 L103.4 140.4 L96 162 L88.6 140.4 L67 133 L88.6 125.6 Z" fill="#fff1d6">
    <animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.1s" begin="-0.6s" repeatCount="indefinite"/>
  </path>
  <path d="M452 282 L457.6 299.4 L475 305 L457.6 310.6 L452 328 L446.4 310.6 L429 305 L446.4 299.4 Z" fill="#8cc63f">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" begin="-1.1s" repeatCount="indefinite"/>
  </path>
</svg>
