  </g>

  <!-- ticker -->
  <g transform="translate(534,332)">
    <rect width="632" height="104" rx="6" fill="#071c1a" stroke="#123f38" stroke-width="1.2"/>
    <text x="10" y="15" font-family="'Arial Black',sans-serif" font-weight="900" font-size="7.5" letter-spacing="2.6" fill="#2bb48c">TICKER · 48px</text>
    <g font-family="'Arial Black',sans-serif" font-size="9.5" letter-spacing="0.6">
      <text x="10" y="42" fill="#f5a81c">CÀ PHÁO +10</text>
      <text x="112" y="42" fill="#8cc63f">ỚT +15</text>
      <text x="176" y="42" fill="#f5a81c">TỎI +10</text>
      <text x="240" y="42" fill="#e8837a">GỪNG +12</text>
      <text x="322" y="42" fill="#f5a81c">MUỐI +8</text>
      <text x="392" y="42" fill="#8cc63f">CẢI +18</text>
      <text x="456" y="42" fill="#e8837a">CẢI VÀNG +45</text>
      <animateTransform attributeName="transform" type="translate" dur="0s" repeatCount="indefinite"/>
    </g>
    <g>
