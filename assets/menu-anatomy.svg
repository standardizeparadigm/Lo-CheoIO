      <circle cx="-10" cy="4" r="5" fill="#0b2a28"/><circle cx="10" cy="4" r="5" fill="#0b2a28"/>
      <circle cx="-8" cy="2" r="1.6" fill="#fff"/><circle cx="12" cy="2" r="1.6" fill="#fff"/>
