    </g>
    <line x1="0" y1="52" x2="632" y2="52" stroke="#123f38" stroke-width="1"/>
    <text x="316" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" letter-spacing="2" fill="#3f8177">V1.1.8 · AGPL-3.0 · STANDARDIZE PARADIGM · 100% OFFLINE</text>
    <text x="10" y="90" font-family="system-ui,sans-serif" font-size="6" fill="#2bb48c">thanh cuộn: 0px — vẫn cuộn được, không hiện bar</text>
