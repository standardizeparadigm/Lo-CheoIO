  <!-- callouts -->
  <g font-family="system-ui,sans-serif" font-size="7.5" fill="#7d9d94">
    <text x="34" y="452">hero giữ đúng band mà planMenuLayout() cấp · không còn khoảng trống dưới tagline</text>
    <text x="1166" y="452" text-anchor="end" fill="#166153">src/components/menu/ · layout · scene · panel · stage · ticker</text>
  </g>
</svg>
