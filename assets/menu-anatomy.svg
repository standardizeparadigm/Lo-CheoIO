        <text x="48" y="27" font-size="6" letter-spacing="1.4" fill="#4f7a70">CHẾ ĐỘ</text>
        <text x="143" y="16" font-size="11" font-weight="700" fill="#f5a81c">14</text>
        <text x="143" y="27" font-size="6" letter-spacing="1.4" fill="#4f7a70">NGUYÊN LIỆU</text>
        <text x="238" y="16" font-size="11" font-weight="700" fill="#f5a81c">16</text>
        <text x="238" y="27" font-size="6" letter-spacing="1.4" fill="#4f7a70">THÀNH TỰU</text>
