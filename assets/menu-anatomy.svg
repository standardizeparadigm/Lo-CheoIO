  <!-- GAME panel -->
  <g transform="translate(34,332)">
    <rect width="238" height="104" rx="6" fill="#0b2a28" stroke="#1c6b5c" stroke-width="1.4"/>
    <text x="10" y="15" font-family="'Arial Black',sans-serif" font-weight="900" font-size="7.5" letter-spacing="2.6" fill="#f5a81c">GAME</text>
    <g font-family="system-ui,sans-serif" font-size="7.5" fill="#d9f2c8">
