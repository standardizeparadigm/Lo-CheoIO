    <text x="150" y="96" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="46" fill="#fdf3e0" opacity="0.95">LỌ</text>
    <text x="112" y="152" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="62" fill="url(#maGold)">CHÉO</text>
