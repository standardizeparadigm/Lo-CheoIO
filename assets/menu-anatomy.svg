<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Giải phẫu màn hình bắt đầu Lọ Chéo v1.1.8 — hero, 14 món trang trí, panel GAME và THÔNG TIN, dải chỉ số, ticker; kèm chú thích từng vùng (hoạt họa SMIL)">
  <defs>
    <linearGradient id="maBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2422"/><stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="maHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2f2b"/><stop offset="1" stop-color="#0a2422"/>
    </linearGradient>
    <linearGradient id="maGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a81c"/><stop offset="0.5" stop-color="#ffd977"/><stop offset="1" stop-color="#f5a81c"/>
    </linearGradient>
    <radialGradient id="maGlow"><stop offset="0" stop-color="#8cc63f" stop-opacity="0.4"/><stop offset="1" stop-color="#8cc63f" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="460" fill="url(#maBg)"/>
  <rect x="1" y="1" width="1198" height="458" rx="14" fill="none" stroke="#123f38" stroke-width="2"/>

  <text x="34" y="34" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="15" letter-spacing="3" fill="#fdf3e0">GIẢI PHẪU MÀN HÌNH BẮT ĐẦU <tspan fill="#9d6bff">v1.1.8</tspan></text>

  <!-- hero band -->
  <g transform="translate(34,52)">
    <rect width="776" height="268" rx="8" fill="url(#maHero)" stroke="#1c6b5c" stroke-width="1.6"/>
    <text x="12" y="18" font-family="system-ui,sans-serif" font-size="8.5" letter-spacing="2" fill="#3f8177">HERO · scene 342px</text>

    <!-- decor dots -->
    <g fill="#8cc63f" opacity="0.75">
      <circle cx="40" cy="60" r="2.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="96" cy="46" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="188" cy="52" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="44" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="66" r="2.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="742" cy="120" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="212" r="1.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="352" cy="222" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

