      <rect x="8" y="42" width="222" height="14" rx="2" fill="#0f3d36"/><text x="14" y="52" opacity="0.55">↺ CHƠI TIẾP</text>
      <rect x="8" y="59" width="222" height="14" rx="2" fill="#0f3d36"/><text x="14" y="69">▦ CHẾ ĐỘ CHƠI</text>
      <rect x="8" y="76" width="222" height="14" rx="2" fill="#0f3d36"/><text x="14" y="86">▸ CÁCH CHƠI · mới ở 1.1.8</text>
    </g>
    <text x="10" y="100" font-family="system-ui,sans-serif" font-size="6.5" letter-spacing="1.6" fill="#5c7d74">7/16 · 9</text>
  </g>

  <!-- INFO panel -->
  <g transform="translate(282,332)">
    <rect width="238" height="104" rx="6" fill="#0b2a28" stroke="#1c6b5c" stroke-width="1.4"/>
    <text x="10" y="15" font-family="'Arial Black',sans-serif" font-weight="900" font-size="7.5" letter-spacing="2.6" fill="#f5a81c">THÔNG TIN</text>
    <g font-family="system-ui,sans-serif" font-size="7.5" fill="#d9f2c8">
      <rect x="8" y="22" width="222" height="14" rx="2" fill="#0f3d36"/><text x="14" y="32">▸ GIỚI THIỆU TÁC GIẢ</text>
      <rect x="8" y="39" width="222" height="14" rx="2" fill="#0f3d36"/><text x="14" y="49">▸ CHANGELOG</text>
      <rect x="8" y="56" width="222" height="14" rx="2" fill="#e63b2e"/><text x="14" y="66" fill="#fdf3e0">× THOÁT</text>
    </g>
