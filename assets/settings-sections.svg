<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Lọ Chéo v1.1.6 — settings rebuilt into six sections with toggles, level bars and pickers">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a35"/><stop offset="0.55" stop-color="#092723"/><stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="ss-hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123732"/><stop offset="0.5" stop-color="#0b2a28"/><stop offset="1" stop-color="#123732"/>
    </linearGradient>
    <linearGradient id="ss-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a81c"/><stop offset="1" stop-color="#ffc94a"/>
    </linearGradient>
    <linearGradient id="ss-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ss-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a81c" stop-opacity="0.3"/><stop offset="1" stop-color="#f5a81c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ss-tiles" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="none" stroke="#2bb48c" stroke-opacity="0.13" stroke-width="1.2"/>
      <rect x="16" y="16" width="24" height="24" transform="rotate(45 28 28)" fill="none" stroke="#f5a81c" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" rx="18" fill="url(#ss-bg)"/>
  <rect width="1200" height="640" rx="18" fill="url(#ss-tiles)"/>
  <circle cx="980" cy="120" r="180" fill="url(#ss-halo)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <text x="600" y="70" text-anchor="middle" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="42" letter-spacing="4" fill="#fdf3e0" stroke="#061a1a" stroke-width="6" paint-order="stroke">CÀI ĐẶT <tspan fill="#f5a81c">v1.1.6</tspan></text>
  <text x="600" y="98" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" letter-spacing="5" fill="#b6e07a">6 MỤC · 3 KIỂU ĐIỀU KHIỂN</text>

  <!-- ============ column 1 ============ -->
  <g>
    <!-- presets card -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 26;0 0" dur="0.7s" fill="freeze"/>
      <rect x="60" y="130" width="520" height="196" rx="10" fill="#0b2a28" stroke="#1e544c" stroke-width="2.5"/>
      <rect x="60" y="130" width="520" height="38" rx="10" fill="url(#ss-hdr)"/>
      <rect x="60" y="158" width="520" height="10" fill="url(#ss-hdr)"/>
      <rect x="60" y="168" width="520" height="2.5" fill="#1e544c"/>
      <path d="M78 149l10 10-10 10z" fill="#f5a81c"/>
      <text x="100" y="157" font-family="'Courier New',monospace" font-weight="700" font-size="15" letter-spacing="4" fill="#9fe3cb">CẤU HÌNH NHANH</text>
      <!-- 4 preset chips -->
      <g font-family="'Courier New',monospace" font-weight="700" font-size="13">
        <rect x="80" y="188" width="232" height="52" rx="6" fill="#123732" stroke="#2bb48c" stroke-width="2"/>
        <text x="98" y="219" fill="#fdf3e0">🪶 MƯỢT</text>
        <rect x="328" y="188" width="232" height="52" rx="6" fill="#f5a81c" fill-opacity="0.18" stroke="#f5a81c" stroke-width="2.5"/>
        <text x="346" y="219" fill="#ffc94a">⚖️ CÂN BẰNG</text>
        <rect x="80" y="252" width="232" height="52" rx="6" fill="#123732" stroke="#2bb48c" stroke-width="2"/>
        <text x="98" y="283" fill="#fdf3e0">🎬 ĐIỆN ẢNH</text>
        <rect x="328" y="252" width="232" height="52" rx="6" fill="#123732" stroke="#2bb48c" stroke-width="2"/>
        <text x="346" y="283" fill="#fdf3e0">⏱️ SPEEDRUN</text>
      </g>
    </g>

    <!-- audio card -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 26;0 0" dur="0.7s" begin="0.2s" fill="freeze"/>
      <rect x="60" y="346" width="520" height="234" rx="10" fill="#0b2a28" stroke="#1e544c" stroke-width="2.5"/>
      <rect x="60" y="346" width="520" height="38" rx="10" fill="url(#ss-hdr)"/>
      <rect x="60" y="374" width="520" height="10" fill="url(#ss-hdr)"/>
      <rect x="60" y="384" width="520" height="2.5" fill="#1e544c"/>
      <path d="M78 365l10 10-10 10z" fill="#f5a81c"/>
      <text x="100" y="373" font-family="'Courier New',monospace" font-weight="700" font-size="15" letter-spacing="4" fill="#9fe3cb">ÂM THANH</text>

      <!-- toggle row -->
      <rect x="80" y="404" width="480" height="50" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
      <text x="96" y="435" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#fdf3e0">SFX</text>
      <rect x="492" y="416" width="52" height="26" rx="13" fill="#8cc63f"/>
      <circle cx="531" cy="429" r="9.5" fill="#061a1a">
        <animate attributeName="cx" values="518;531;518" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- volume level row -->
      <rect x="80" y="466" width="480" height="50" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
      <text x="96" y="497" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#fdf3e0">ÂM LƯỢNG SFX</text>
      <g>
        <rect x="250" y="478" width="12" height="26" fill="#8cc63f" transform="skewX(-8)"/>
        <rect x="268" y="478" width="12" height="26" fill="#8cc63f" transform="skewX(-8)"/>
        <rect x="286" y="478" width="12" height="26" fill="#8cc63f" transform="skewX(-8)"/>
        <rect x="304" y="478" width="12" height="26" fill="#8cc63f" transform="skewX(-8)"/>
        <rect x="322" y="478" width="12" height="26" fill="#8cc63f" transform="skewX(-8)"/>
        <rect x="340" y="478" width="12" height="26" fill="#8cc63f" transform="skewX(-8)"/>
        <rect x="358" y="478" width="12" height="26" fill="#8cc63f" transform="skewX(-8)"/>
        <rect x="376" y="478" width="12" height="26" fill="#8cc63f" transform="skewX(-8)"/>
        <rect x="394" y="478" width="12" height="26" fill="#123732" stroke="#1e544c"/>
        <rect x="412" y="478" width="12" height="26" fill="#123732" stroke="#1e544c"/>
        <animate attributeName="opacity" values="1;1;1" dur="1s"/>
      </g>
      <text x="450" y="498" font-family="'Courier New',monospace" font-weight="700" font-size="15" fill="#ffc94a">80</text>

      <!-- music row -->
      <rect x="80" y="528" width="480" height="34" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
      <text x="96" y="551" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#fdf3e0">NHẠC NỀN</text>
      <rect x="420" y="537" width="52" height="16" rx="8" fill="#2bb48c"/>
      <circle cx="457" cy="545" r="6" fill="#061a1a"/>
      <text x="492" y="551" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#b6e07a">60</text>
    </g>
  </g>

  <!-- ============ column 2 ============ -->
  <g>
    <!-- display card -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 26;0 0" dur="0.7s" begin="0.1s" fill="freeze"/>
      <rect x="620" y="130" width="520" height="252" rx="10" fill="#0b2a28" stroke="#1e544c" stroke-width="2.5"/>
      <rect x="620" y="130" width="520" height="38" rx="10" fill="url(#ss-hdr)"/>
      <rect x="620" y="158" width="520" height="10" fill="url(#ss-hdr)"/>
      <rect x="620" y="168" width="520" height="2.5" fill="#1e544c"/>
      <path d="M638 149l10 10-10 10z" fill="#f5a81c"/>
      <text x="660" y="157" font-family="'Courier New',monospace" font-weight="700" font-size="15" letter-spacing="4" fill="#9fe3cb">GIAO DIỆN &amp; CHUYỂN ĐỘNG</text>

      <rect x="640" y="188" width="480" height="46" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
      <text x="656" y="216" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#fdf3e0">MỨC RUNG</text>
      <rect x="900" y="199" width="100" height="26" fill="none" stroke="#f5a81c" stroke-width="2.5"/>
      <rect x="901" y="200" width="49" height="24" fill="#f5a81c"/>
      <text x="912" y="218" font-family="'Courier New',monospace" font-weight="700" font-size="12" fill="#061a1a">NHẸ</text>
      <text x="962" y="218" font-family="'Courier New',monospace" font-weight="700" font-size="12" fill="#9fe3cb">MẠNH</text>

      <rect x="640" y="242" width="480" height="46" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
      <text x="656" y="270" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#fdf3e0">CHẤT LƯỢNG HÌNH</text>
      <rect x="900" y="253" width="100" height="26" fill="none" stroke="#f5a81c" stroke-width="2.5"/>
      <rect x="950" y="254" width="49" height="24" fill="#f5a81c"/>
      <text x="912" y="272" font-family="'Courier New',monospace" font-weight="700" font-size="12" fill="#9fe3cb">THẤP</text>
      <text x="962" y="272" font-family="'Courier New',monospace" font-weight="700" font-size="12" fill="#061a1a">CAO</text>

      <rect x="640" y="296" width="480" height="34" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
      <text x="656" y="319" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#fdf3e0">TỰ TẠM DỪNG KHI ĐỔI TAB</text>
      <rect x="1040" y="305" width="52" height="16" rx="8" fill="#8cc63f"/>
      <circle cx="1077" cy="313" r="6" fill="#061a1a"/>

      <rect x="640" y="338" width="480" height="30" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
      <text x="656" y="359" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#fdf3e0">GIẢM CHUYỂN ĐỘNG</text>
      <rect x="1040" y="345" width="52" height="16" rx="8" fill="#123732" stroke="#1e544c"/>
      <circle cx="1047" cy="353" r="6" fill="#9fe3cb"/>
    </g>

    <!-- language card: gradient ring + flags -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 26;0 0" dur="0.7s" begin="0.3s" fill="freeze"/>
      <rect x="620" y="398" width="520" height="182" rx="10" fill="#0b2a28" stroke="#1e544c" stroke-width="2.5"/>
      <rect x="620" y="398" width="520" height="38" rx="10" fill="url(#ss-hdr)"/>
      <rect x="620" y="426" width="520" height="10" fill="url(#ss-hdr)"/>
      <rect x="620" y="436" width="520" height="2.5" fill="#1e544c"/>
      <path d="M638 417l10 10-10 10z" fill="#f5a81c"/>
      <text x="660" y="425" font-family="'Courier New',monospace" font-weight="700" font-size="15" letter-spacing="4" fill="#9fe3cb">NGÔN NGỮ</text>

      <g font-family="'Courier New',monospace" font-weight="700" font-size="13">
        <rect x="640" y="456" width="230" height="46" rx="6" fill="#f5a81c" fill-opacity="0.15" stroke="#f5a81c" stroke-width="2.5"/>
        <text x="660" y="485" fill="#ffc94a">🇻🇳 Tiếng Việt</text>
        <path d="M832 479l7 8 14-16" stroke="#ffc94a" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <rect x="890" y="456" width="230" height="46" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
        <text x="910" y="485" fill="#fdf3e0">🇬🇧 English</text>

        <rect x="640" y="512" width="230" height="46" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
        <text x="660" y="541" fill="#fdf3e0">🇨🇳 中文</text>

        <rect x="890" y="512" width="230" height="46" rx="6" fill="#123732" stroke="#1e544c" stroke-width="2"/>
        <text x="910" y="541" fill="#fdf3e0">🇯🇵 日本語</text>
      </g>
    </g>
  </g>

  <!-- animated sweep gliding across the title -->
  <g opacity="0.55">
    <rect x="-260" y="42" width="200" height="70" fill="url(#ss-sweep)" transform="skewX(-18)">
      <animate attributeName="x" values="-260;1240" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- footer note -->
  <text x="600" y="612" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="12" letter-spacing="3" fill="#5f9c33">NGÔN NGỮ DỜI VÀO CÀI ĐẶT · 4 PRESET · SAO LƯU JSON · TỰ PAUSE KHI ĐỔI TAB</text>
</svg>
