<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Sơ đồ sửa lỗi bố cục v1.1.7 và v1.1.8 — 720px cửa sổ: trước 250px hero cộng 470px chrome, sau 342px hero cộng 378px chrome dự phòng (hoạt họa SMIL)">
  <defs>
    <linearGradient id="lfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2422"/>
      <stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="lfScene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f38"/>
      <stop offset="1" stop-color="#0b2a28"/>
    </linearGradient>
    <linearGradient id="lfChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d6bff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9d6bff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="lfGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8cc63f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8cc63f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8cc63f" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.5;0.5;-0.5" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.1;0.9;-0.1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <marker id="lfArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8cc63f"/>
    </marker>
    <clipPath id="lfSceneClip"><rect x="1" y="1" width="468" height="60"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#lfBg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="none" stroke="#123f38" stroke-width="2"/>

  <!-- ============ TRƯỚC ============ -->
  <text x="60" y="34" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="15" letter-spacing="2" fill="#e63b2e">TRƯỚC · v1.1.7</text>
  <text x="60" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#7d9d94">720px = scene 250 + chrome 470 · scene bị ép còn 250</text>

  <g transform="translate(60,68)">
    <!-- cửa sổ 720px, tỉ lệ 1px vẽ = 4.09px thật -->
    <rect width="470" height="176" fill="#0a2220" stroke="#e63b2e" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- scene: 250 / 720 -->
    <rect x="1" y="1" width="468" height="61" fill="url(#lfScene)"/>
    <text x="14" y="24" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="16" fill="#fdf3e0">LỌ</text>
    <text x="14" y="50" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="21" fill="#f5a81c">CHÉO</text>
    <!-- chú lọ bị cắt ở seam -->
    <g transform="translate(372,-8)" clip-path="url(#lfSceneClip)">
      <path d="M12 6C2 14 4 38 11 48h38c7-10 9-32-1-40z" fill="#f3e3c8" stroke="#0b2a28" stroke-width="3"/>
      <rect x="14" y="34" width="32" height="7" fill="#10403a"/>
      <circle cx="22" cy="20" r="3.4" fill="#fffdf6" stroke="#0b2a28" stroke-width="1.4"/>
      <circle cx="38" cy="20" r="3.4" fill="#fffdf6" stroke="#0b2a28" stroke-width="1.4"/>
    </g>
    <!-- seam -->
    <line x1="1" y1="61" x2="469" y2="61" stroke="#e63b2e" stroke-width="2.5"/>
    <text x="120" y="74" font-family="system-ui,sans-serif" font-size="8" fill="#ff8f7a">cắt ở y≈247px — chú lọ mất nửa thân</text>
    <!-- hàng panel: 415px, vẫn trong flex flow -->
    <rect x="14" y="68" width="176" height="88" fill="#0b2a28" stroke="#166153" stroke-width="2"/>
    <rect x="280" y="68" width="176" height="88" fill="#0b2a28" stroke="#166153" stroke-width="2"/>
    <text x="24" y="86" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="9" fill="#ffc94a">GAME</text>
    <text x="290" y="86" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="9" fill="#ffc94a">INFO</text>
    <text x="24" y="150" font-family="system-ui,sans-serif" font-size="9" fill="#8cc63f">415px</text>
    <text x="290" y="150" font-family="system-ui,sans-serif" font-size="9" fill="#8cc63f">415px</text>
    <!-- ticker: 55px, xuống dòng và bị cắt -->
    <rect x="1" y="161" width="468" height="14" fill="#10403a"/>
    <text x="10" y="171" font-family="system-ui,sans-serif" font-size="7" fill="#7d9d94" opacity="0.6">v1.1.7 · AGPL-3.0 · … (dòng 2 bị cắt)</text>
    <!-- chú thích -->
    <line x1="470" y1="30" x2="500" y2="30" stroke="#e63b2e" stroke-width="1" marker-end="url(#lfArrow)"/>
    <text x="476" y="44" font-family="system-ui,sans-serif" font-size="9.5" fill="#ff8f7a">scene</text>
    <text x="476" y="57" font-family="system-ui,sans-serif" font-size="9.5" fill="#ff8f7a">= 250px</text>
  </g>

  <!-- divider -->
  <line x1="590" y1="70" x2="590" y2="246" stroke="#166153" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ============ SAU ============ -->
  <text x="640" y="34" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="15" letter-spacing="2" fill="#8cc63f">SAU · v1.1.8</text>
  <text x="640" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#7d9d94">720px = scene 342 + reserve 378 · không cắt gì</text>

  <g transform="translate(640,68)">
    <rect width="470" height="176" fill="#0a2220" stroke="#8cc63f" stroke-width="2"/>
    <!-- scene: 342 / 720 -->
    <rect x="1" y="1" width="468" height="83" fill="url(#lfScene)"/>
    <text x="14" y="30" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="18" fill="#fdf3e0">LỌ</text>
    <text x="14" y="58" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="23" fill="#f5a81c">CHÉO</text>
    <!-- chú lọ nguyên vẹn -->
    <g transform="translate(372,14)">
      <ellipse cx="30" cy="50" rx="22" ry="4" fill="#0b2a28" opacity="0.6"/>
      <path d="M12 6C2 14 4 38 11 48h38c7-10 9-32-1-40z" fill="#f3e3c8" stroke="#0b2a28" stroke-width="3"/>
      <rect x="14" y="34" width="32" height="7" fill="#10403a"/>
      <circle cx="22" cy="20" r="3.4" fill="#fffdf6" stroke="#0b2a28" stroke-width="1.4"/>
      <circle cx="38" cy="20" r="3.4" fill="#fffdf6" stroke="#0b2a28" stroke-width="1.4"/>
      <animateTransform attributeName="transform" type="translate" values="372,14;372,8;372,14" dur="4s" repeatCount="indefinite"/>
    </g>
    <!-- dải dự phòng -->
    <rect x="1" y="84" width="468" height="91" fill="url(#lfChrome)"/>
    <line x1="1" y1="84" x2="469" y2="84" stroke="#9d6bff" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="8" y="96" font-family="system-ui,sans-serif" font-size="7.5" fill="#bfa2ff">reserve 378px — hero giữ chỗ bằng padding-bottom</text>
    <!-- hàng panel nổi, 318px -->
    <rect x="14" y="102" width="176" height="44" fill="#0b2a28" stroke="#166153" stroke-width="1.6"/>
    <rect x="280" y="102" width="176" height="44" fill="#0b2a28" stroke="#166153" stroke-width="1.6"/>
    <text x="24" y="119" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="8" fill="#ffc94a">GAME</text>
    <text x="290" y="119" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="8" fill="#ffc94a">INFO</text>
    <text x="118" y="139" font-family="system-ui,sans-serif" font-size="7.5" fill="#8cc63f">318px</text>
    <text x="384" y="139" font-family="system-ui,sans-serif" font-size="7.5" fill="#8cc63f">318px</text>
    <!-- ticker: một hàng, nguyên vẹn -->
    <rect x="1" y="161" width="468" height="14" fill="#10403a"/>
    <text x="8" y="171" font-family="system-ui,sans-serif" font-size="7" fill="#8cc63f">v1.1.8 · AGPL-3.0 · Standardize Paradigm · 100% offline</text>
    <!-- chú thích -->
    <line x1="470" y1="42" x2="500" y2="42" stroke="#2bb48c" stroke-width="1" marker-end="url(#lfArrow)"/>
    <text x="476" y="56" font-family="system-ui,sans-serif" font-size="9.5" fill="#2bb48c">scene</text>
    <text x="476" y="69" font-family="system-ui,sans-serif" font-size="9.5" fill="#8cc63f">= 342px</text>
    <text x="476" y="136" font-family="system-ui,sans-serif" font-size="9" fill="#9d6bff">reserve</text>
    <text x="476" y="149" font-family="system-ui,sans-serif" font-size="9" fill="#9d6bff">= 378px</text>
  </g>

  <!-- vệt sáng chạy qua nửa đã sửa -->
  <rect x="640" y="252" width="470" height="3" fill="url(#lfGlow)"/>

  <text x="60" y="290" font-family="system-ui,sans-serif" font-size="9" fill="#7d9d94">src/components/menu/layout/metrics.ts · fit.ts — 32 test khoá phép cộng</text>
  <text x="640" y="290" font-family="system-ui,sans-serif" font-size="9" fill="#7d9d94">src/components/menu/MenuChrome.tsx — chrome ra khỏi flex flow</text>
</svg>
