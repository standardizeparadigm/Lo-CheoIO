<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 292" role="img" aria-label="Sơ đồ bố cục màn hình bắt đầu v1.1.8 — scene chiếm toàn bộ chiều cao, hàng panel GAME/INFO và ticker nổi phía trên (hoạt họa SMIL)">
  <defs>
    <linearGradient id="lbScene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3330"/>
      <stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="lbChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a28" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#061a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lbGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d6bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfa2ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9d6bff" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.5;0.5;-0.5" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.1;0.9;-0.1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <marker id="lbArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8cc63f"/>
    </marker>
    <clipPath id="lfSceneClip"><rect x="1" y="1" width="468" height="60"/></clipPath>
  </defs>

  <rect width="1200" height="292" fill="#061a1a"/>

  <!-- ================= BEFORE (left) ================= -->
  <text x="60" y="34" font-family="Bungee, sans-serif" font-size="15" fill="#e63b2e" letter-spacing="2">TRƯỚC · v1.1.7</text>
  <text x="60" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#7d9d94">720px = scene 250 + chrome 470 · scene bị ép còn 250</text>

  <g transform="translate(60,68)">
    <!-- the whole 720px window, to scale: 1px drawn = 4.09px real -->
    <rect width="470" height="176" fill="#0a2220" stroke="#e63b2e" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- scene: 250 of 720 -->
    <rect x="1" y="1" width="468" height="61" fill="url(#lbScene)"/>
    <text x="14" y="24" font-family="Bungee, sans-serif" font-size="16" fill="#fdf3e0">LỌ</text>
    <text x="14" y="50" font-family="Bungee, sans-serif" font-size="21" fill="#f5a81c">CHÉO</text>
    <!-- the jar, cut at the seam — its lower half is inside the chrome -->
    <g transform="translate(372,-8)" clip-path="url(#lfSceneClip)">
      <path d="M12 6C2 14 4 38 11 48h38c7-10 9-32-1-40z" fill="#f3e3c8" stroke="#0b2a28" stroke-width="3"/>
      <rect x="14" y="34" width="32" height="7" fill="#10403a"/>
      <circle cx="22" cy="20" r="3.4" fill="#fffdf6" stroke="#0b2a28" stroke-width="1.4"/>
      <circle cx="38" cy="20" r="3.4" fill="#fffdf6" stroke="#0b2a28" stroke-width="1.4"/>
    </g>
    <!-- the seam at y = 250/720 -->
    <line x1="1" y1="61" x2="469" y2="61" stroke="#e63b2e" stroke-width="2.5"/>
    <text x="120" y="56" font-family="system-ui, sans-serif" font-size="8.5" fill="#ff8f7a">cắt ở y≈247px — chú lọ mất nửa thân</text>
    <!-- corner row: 415 of 720, still in the flex flow -->
    <rect x="14" y="68" width="176" height="88" fill="#0b2a28" stroke="#166153" stroke-width="2"/>
    <rect x="280" y="68" width="176" height="88" fill="#0b2a28" stroke="#166153" stroke-width="2"/>
    <text x="24" y="86" font-family="Bungee, sans-serif" font-size="9" fill="#ffc94a">GAME</text>
    <text x="290" y="86" font-family="Bungee, sans-serif" font-size="9" fill="#ffc94a">INFO</text>
    <text x="24" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#8cc63f">415px</text>
    <text x="290" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#8cc63f">415px</text>
    <!-- ticker: 55 of 720, wraps and clips -->
    <rect x="1" y="161" width="468" height="14" fill="#10403a"/>
    <text x="10" y="171" font-family="system-ui, sans-serif" font-size="7" fill="#7d9d94" opacity="0.6">v1.1.7 · AGPL-3.0 · … (dòng 2 bị cắt)</text>
    <!-- annotation -->
    <line x1="470" y1="30" x2="500" y2="30" stroke="#e63b2e" stroke-width="1" marker-end="url(#lbArrow)"/>
    <text x="476" y="44" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff8f7a">scene</text>
    <text x="476" y="57" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff8f7a">= 250px</text>
  </g>

  <!-- divider -->
  <line x1="590" y1="70" x2="590" y2="236" stroke="#166153" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ================= AFTER (right) ================= -->
  <text x="640" y="34" font-family="Bungee, sans-serif" font-size="15" fill="#8cc63f" letter-spacing="2">SAU · v1.1.8</text>
  <text x="640" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#7d9d94">720px = scene 382 + reserve 338 · không cắt gì</text>

  <g transform="translate(640,68)">
    <!-- same 720px window at the same scale, so the two halves compare -->
    <rect width="470" height="176" fill="#0a2220" stroke="#8cc63f" stroke-width="2"/>
    <!-- scene: 382 of 720 -->
    <rect x="1" y="1" width="468" height="93" fill="url(#lbScene)"/>
    <text x="14" y="32" font-family="Bungee, sans-serif" font-size="18" fill="#fdf3e0">LỌ</text>
    <text x="14" y="60" font-family="Bungee, sans-serif" font-size="23" fill="#f5a81c">CHÉO</text>
    <!-- jar, whole -->
    <g transform="translate(372,18)">
      <ellipse cx="30" cy="52" rx="22" ry="4" fill="#0b2a28" opacity="0.6"/>
      <path d="M12 6C2 14 4 38 11 48h38c7-10 9-32-1-40z" fill="#f3e3c8" stroke="#0b2a28" stroke-width="3"/>
      <rect x="14" y="34" width="32" height="7" fill="#10403a"/>
      <circle cx="22" cy="20" r="3.4" fill="#fffdf6" stroke="#0b2a28" stroke-width="1.4"/>
      <circle cx="38" cy="20" r="3.4" fill="#fffdf6" stroke="#0b2a28" stroke-width="1.4"/>
      <animateTransform attributeName="transform" type="translate" values="372,18;372,12;372,18" dur="4s" repeatCount="indefinite"/>
    </g>
    <!-- the reserve the scene now declines to use -->
    <rect x="1" y="94" width="468" height="81" fill="url(#lbChrome)"/>
    <line x1="1" y1="94" x2="469" y2="94" stroke="#9d6bff" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="8" y="104" font-family="system-ui, sans-serif" font-size="7.5" fill="#bfa2ff">reserve 338px — scene giữ chỗ bằng padding-bottom</text>
    <!-- corner row, floating, 268px -->
    <rect x="14" y="109" width="176" height="44" fill="#0b2a28" stroke="#166153" stroke-width="1.6"/>
    <rect x="280" y="109" width="176" height="44" fill="#0b2a28" stroke="#166153" stroke-width="1.6"/>
    <text x="24" y="126" font-family="Bungee, sans-serif" font-size="8" fill="#ffc94a">GAME</text>
    <text x="290" y="126" font-family="Bungee, sans-serif" font-size="8" fill="#ffc94a">INFO</text>
    <text x="24" y="146" font-family="system-ui, sans-serif" font-size="7.5" fill="#8cc63f">268px</text>
    <text x="290" y="146" font-family="system-ui, sans-serif" font-size="7.5" fill="#8cc63f">268px</text>
    <!-- ticker, one row, whole -->
    <rect x="1" y="161" width="468" height="14" fill="#10403a"/>
    <text x="8" y="171" font-family="system-ui, sans-serif" font-size="7" fill="#8cc63f">v1.1.8 · AGPL-3.0 · Standardize Paradigm · 100% offline</text>
    <!-- annotation -->
    <line x1="470" y1="46" x2="500" y2="46" stroke="#2bb48c" stroke-width="1" marker-end="url(#lbArrow)"/>
    <text x="476" y="60" font-family="system-ui, sans-serif" font-size="9.5" fill="#2bb48c">scene</text>
    <text x="476" y="73" font-family="system-ui, sans-serif" font-size="9.5" fill="#8cc63f">= 382px</text>
    <text x="476" y="140" font-family="system-ui, sans-serif" font-size="9" fill="#9d6bff">reserve</text>
    <text x="476" y="153" font-family="system-ui, sans-serif" font-size="9" fill="#9d6bff">= 338px</text>
  </g>

  <!-- moving highlight across the fix -->
  <rect x="640" y="252" width="470" height="3" fill="url(#lbGlow)"/>

  <text x="60" y="282" font-family="system-ui, sans-serif" font-size="9" fill="#7d9d94">src/components/menu/layout/metrics.ts · fit.ts — 22 test khoá phép cộng</text>
</svg>
