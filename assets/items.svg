<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-label="The 14 ingredients — pickles to catch, gold powers to grab, hazards to dodge">
  <defs>
    <filter id="it-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="itemsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a35"/>
      <stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a81c"/>
      <stop offset="0.5" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#f5a81c"/>
      <animate attributeName="x1" values="-1;1;-1" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="250" rx="16" fill="url(#itemsBg)"/>
  <!-- Bloom under the heading: the same radial falloff the
       banner uses, at a fifth of the size. It is what stops a
       dark-on-dark diagram from looking printed rather than lit. -->
  <ellipse cx="240" cy="40" rx="200" ry="34" fill="#f5a81c" opacity="0.10">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <text x="600" y="30" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700"
    font-size="12" letter-spacing="6" fill="#2bb48c">— 14 INGREDIENTS · 3 GROUPS —</text>

  <!-- ===== row 1: pickles (catch) ===== -->
  <g font-family="'Courier New',monospace" font-weight="700" font-size="10.5" text-anchor="middle">
    <g><rect x="18" y="48" width="152" height="78" rx="10" fill="#10261f" stroke="#2bb48c" stroke-opacity="0.45"/><circle cx="94" cy="76" r="14" fill="#e9f0c9" stroke="#a9c46a" stroke-width="3"/><text x="94" y="112" fill="#fdf3e0">EGGPLANT +10</text></g>
    <g><rect x="186" y="48" width="152" height="78" rx="10" fill="#10261f" stroke="#2bb48c" stroke-opacity="0.45"/><circle cx="262" cy="76" r="14" fill="#e63b2e" stroke="#8f1a1c" stroke-width="3"/><text x="262" y="112" fill="#fdf3e0">CHILI +15</text></g>
    <g><rect x="354" y="48" width="152" height="78" rx="10" fill="#10261f" stroke="#2bb48c" stroke-opacity="0.45"/><circle cx="430" cy="76" r="14" fill="#f6ecd9" stroke="#c9b193" stroke-width="3"/><text x="430" y="112" fill="#fdf3e0">GARLIC +10</text></g>
    <g><rect x="522" y="48" width="152" height="78" rx="10" fill="#10261f" stroke="#2bb48c" stroke-opacity="0.45"/><circle cx="598" cy="76" r="14" fill="#e2b267" stroke="#a9743a" stroke-width="3"/><text x="598" y="112" fill="#fdf3e0">GINGER +12</text></g>
    <g><rect x="690" y="48" width="152" height="78" rx="10" fill="#10261f" stroke="#2bb48c" stroke-opacity="0.45"/><circle cx="766" cy="76" r="12" fill="#ffffff" stroke="#cfe3ea" stroke-width="3"/><text x="766" y="112" fill="#fdf3e0">SALT +8</text></g>
    <g><rect x="858" y="48" width="152" height="78" rx="10" fill="#10261f" stroke="#2bb48c" stroke-opacity="0.45"/><circle cx="934" cy="76" r="15" fill="#8cc63f" stroke="#3f7d2a" stroke-width="3"/><text x="934" y="112" fill="#fdf3e0">GREENS +18</text></g>
    <g><rect x="1026" y="48" width="156" height="78" rx="10" fill="#171307" stroke="#ffd766" stroke-opacity="0.75"/><circle cx="1104" cy="76" r="15" fill="#ffd766" stroke="#b8770e" stroke-width="3"><animate attributeName="r" values="15;17.5;15" dur="1.4s" repeatCount="indefinite"/></circle><text x="1104" y="112" fill="#ffd766">GOLD GREENS +45</text></g>
  </g>

  <!-- ===== row 2: powers & hazards ===== -->
  <g font-family="'Courier New',monospace" font-weight="700" font-size="10.5" text-anchor="middle">
    <g><rect x="18" y="140" width="152" height="78" rx="10" fill="#171307" stroke="url(#goldChip)" stroke-width="2.4"/><circle cx="94" cy="168" r="13" fill="#ffc94a" stroke="#d4850a" stroke-width="3"/><text x="94" y="204" fill="#ffc94a">GOLD SALT +120</text></g>
    <g><rect x="186" y="140" width="152" height="78" rx="10" fill="#1b0d05" stroke="#ff6a4d" stroke-opacity="0.8"/><circle cx="262" cy="168" r="13" fill="#ff6a4d" stroke="#b81f22" stroke-width="3"><animate attributeName="opacity" values="1;0.55;1" dur="1.1s" repeatCount="indefinite"/></circle><text x="262" y="204" fill="#ff6a4d">FIERY CHILI ×2</text></g>
    <g><rect x="354" y="140" width="152" height="78" rx="10" fill="#0a1a24" stroke="#a8e6ff" stroke-opacity="0.75"/><circle cx="430" cy="168" r="13" fill="#a8e6ff" stroke="#3d8fb8" stroke-width="3"/><text x="430" y="204" fill="#a8e6ff">ICE SLOW-MO</text></g>
    <g><rect x="522" y="140" width="152" height="78" rx="10" fill="#171307" stroke="#ffe9a8" stroke-opacity="0.8"/><circle cx="598" cy="168" r="13" fill="#ffe9a8" stroke="#c79b2d" stroke-width="3"/><text x="598" y="204" fill="#ffe9a8">GOLD GARLIC SHIELD</text></g>
    <g><rect x="690" y="140" width="152" height="78" rx="10" fill="#141a10" stroke="#e63b2e" stroke-width="2.2"/><circle cx="766" cy="168" r="14" fill="#7d8f6a" stroke="#3b4a33" stroke-width="3"/><text x="766" y="204" fill="#ff8d7e">⚠ MOULD +25</text></g>
    <g><rect x="858" y="140" width="152" height="78" rx="10" fill="#141a10" stroke="#e63b2e" stroke-width="2.2"/><circle cx="934" cy="168" r="12" fill="#2c2f3a" stroke="#9aa4b8" stroke-width="2.6"/><text x="934" y="204" fill="#ff8d7e">⚠ FLY +30</text></g>
    <g><rect x="1026" y="140" width="156" height="78" rx="10" fill="#141a10" stroke="#e63b2e" stroke-width="2.2"/><circle cx="1104" cy="168" r="13" fill="#9dbb4e" stroke="#4a5d1e" stroke-width="3"/><text x="1104" y="204" fill="#ff8d7e">⚠ CATERPILLAR +40</text></g>
  </g>
</svg>
