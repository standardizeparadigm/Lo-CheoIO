<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" role="presentation" aria-hidden="true">
  <!--
    The section rule between README blocks.

    Redrawn in round 6. The previous version was two dashed lines and three
    stars — flat, with no gradient, no glow and no depth, which is why it read
    as a placeholder next to the other nineteen assets. It is the *most seen*
    file in the repo (it appears between every top-level section of all ten
    READMEs), so it was the cheapest place to raise the quality floor.
  -->
  <defs>
    <!-- The taper: the rule is brightest at the centre and dissolves at both
         edges, so it never collides with the page margin. -->
    <linearGradient id="dv-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb48c" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#2bb48c" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#4fd3aa" stop-opacity="0.8"/>
      <stop offset="0.82" stop-color="#2bb48c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2bb48c" stop-opacity="0"/>
    </linearGradient>

    <!-- A travelling highlight that rides along the rule. -->
    <linearGradient id="dv-sweep" x1="0" y1="0" x2="0.16" y2="0">
      <stop offset="0" stop-color="#4fd3aa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9ffe9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4fd3aa" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.2;1.2;1.2" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.4;1.4" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="dv-orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffc94a"/>
      <stop offset="1" stop-color="#f5a81c" stop-opacity="0"/>
    </radialGradient>

    <!-- One blur, reused by the orb and the stars: four filters would be four
         separate offscreen buffers for a 40px-tall strip. -->
    <filter id="dv-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dv-soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- ==== the rule ======================================================= -->
  <line x1="0" y1="20" x2="524" y2="20" stroke="url(#dv-fade)" stroke-width="2" stroke-linecap="round"/>
  <line x1="676" y1="20" x2="1200" y2="20" stroke="url(#dv-fade)" stroke-width="2" stroke-linecap="round"/>

  <!-- A soft underglow so the rule sits *in* the page rather than on it. -->
  <line x1="120" y1="20" x2="1080" y2="20" stroke="#2bb48c" stroke-opacity="0.3" stroke-width="4" filter="url(#dv-soft)"/>

  <!-- The sweep rides the whole rule, gaps included. -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#dv-sweep)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Dashed ticks: the "stitched" texture, faded at the ends by the same
       gradient so they do not stop abruptly. -->
  <line x1="40" y1="20" x2="500" y2="20" stroke="#2bb48c" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="1 11" stroke-linecap="round"/>
  <line x1="700" y1="20" x2="1160" y2="20" stroke="#2bb48c" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="1 11" stroke-linecap="round"/>

  <!-- ==== the centre orb ================================================= -->
  <circle cx="600" cy="20" r="13" fill="url(#dv-orb)" opacity="0.55">
    <animate attributeName="r" values="11;15;11" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#dv-glow)">
    <path d="M600 5.2 l4.6 10.2 10.2 4.6 -10.2 4.6 -4.6 10.2 -4.6 -10.2 -10.2 -4.6 10.2 -4.6 Z" fill="#f5a81c">
      <animate attributeName="fill" values="#f5a81c;#fff3c4;#f5a81c" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- Inner facet: a second, smaller star rotated 45°, which is what makes
         the shape read as a sparkle instead of a compass needle. -->
    <path d="M600 9.5 l2.2 5.9 5.9 2.2 -5.9 2.2 -2.2 5.9 -2.2 -5.9 -5.9 -2.2 5.9 -2.2 Z" fill="#fffaf0" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ==== satellites ===================================================== -->
  <g fill="#ffc94a">
    <path d="M536 12 l2.6 5.8 5.8 2.6 -5.8 2.6 -2.6 5.8 -2.6 -5.8 -5.8 -2.6 5.8 -2.6 Z" opacity="0.9">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 536 20;90 536 20;180 536 20" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M664 12 l2.6 5.8 5.8 2.6 -5.8 2.6 -2.6 5.8 -2.6 -5.8 -5.8 -2.6 5.8 -2.6 Z" opacity="0.9">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 664 20;-90 664 20;-180 664 20" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Two dimmer dots, further out, with their own rhythm — the strip is
       1200×40 and a single repeating motif across it looks like a pattern
       rather than a decoration. -->
  <circle cx="470" cy="20" r="1.6" fill="#4fd3aa">
    <animate attributeName="opacity" values="0;0.8;0" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="20" r="1.6" fill="#4fd3aa">
    <animate attributeName="opacity" values="0;0.8;0" dur="3.8s" begin="2.1s" repeatCount="indefinite"/>
  </circle>
</svg>
