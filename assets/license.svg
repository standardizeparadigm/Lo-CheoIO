<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Lọ Chéo license — GNU AGPL-3.0-only, copyleft free software">
  <defs>
    <radialGradient id="sealBg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#123f38"/>
      <stop offset="0.55" stop-color="#0b2823"/>
      <stop offset="1" stop-color="#061a1a"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a81c"/>
      <stop offset="0.5" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#d4850a"/>
      <animate attributeName="x1" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="2.8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc94a"/>
      <stop offset="1" stop-color="#a9743a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#sealBg)"/>
  <text x="600" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700"
    font-size="11" letter-spacing="6" fill="#2bb48c">— LICENSE · GIẤY PHÉP —</text>

  <!-- ===== animated seal (left) ===== -->
  <g transform="translate(246 152)">
    <circle r="92" fill="#0b2823" stroke="#123f38" stroke-width="2"/>
    <circle r="87" fill="none" stroke="url(#goldRing)" stroke-width="6" stroke-dasharray="15 11" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="66" fill="#081f1c" stroke="#f5a81c" stroke-width="2.4"/>
    <text y="-46" text-anchor="middle" font-family="'Bungee','Arial Black',sans-serif"
      font-size="14" letter-spacing="4" fill="#ffc94a">GNU AGPL</text>

    <!-- scales of justice -->
    <g stroke="url(#beam)" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="0" y1="-30" x2="0" y2="26"/>
      <line x1="-32" y1="-19" x2="32" y2="-19"/>
      <line x1="-21" y1="26" x2="21" y2="26"/>
    </g>
    <g stroke="#ffc94a" stroke-width="2.5" fill="#123f38" stroke-linejoin="round">
      <line x1="-32" y1="-19" x2="-46" y2="13"/>
      <line x1="-32" y1="-19" x2="-18" y2="13"/>
      <path d="M -50 13 A 18 11 0 0 0 -14 13 Z"/>
      <line x1="32" y1="-19" x2="18" y2="13"/>
      <line x1="32" y1="-19" x2="46" y2="13"/>
      <path d="M 14 13 A 18 11 0 0 0 50 13 Z"/>
    </g>
    <circle cy="-30" r="4.4" fill="#ffc94a" stroke="#061a1a" stroke-width="1.6"/>

    <text y="48" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700"
      font-size="10.5" letter-spacing="3" fill="#a8e6ff">COPYLEFT</text>
    <animate attributeName="opacity" values="0.88;1;0.88" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- ===== rights text (right) ===== -->
  <g font-family="'Bungee','Arial Black',sans-serif" fill="#fdf3e0">
    <text x="412" y="112" font-size="40" fill="#ffc94a">AGPL-3.0-only</text>
    <text x="412" y="147" font-size="16.5" fill="#fdf3e0" letter-spacing="1">GNU AFFERO GENERAL PUBLIC LICENSE</text>
    <text x="412" y="172" font-size="12" fill="#a8e6ff" font-family="'Courier New',monospace" font-weight="700"
      letter-spacing="2">FREE AS IN FREEDOM · SAME LICENSE FOR FORKS</text>
  </g>
  <g font-family="'Be Vietnam Pro','Helvetica',sans-serif" font-size="12.5" fill="#cdd8cf">
    <text x="412" y="203">✔ Chạy, sửa, chia sẻ, thậm chí bán — miễn là giữ nguyên AGPL-3.0</text>
    <text x="412" y="223">✔ Dùng trên mạng (SaaS) cũng phải công bố mã nguồn đã sửa</text>
    <text x="412" y="245" opacity="0.72">© 2026 Standardize Paradigm · standardizeparadigm@donuco.com · LICENSE</text>
  </g>
</svg>
