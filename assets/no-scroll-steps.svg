<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Bốn mức tiết kiệm chiều cao của Lọ Chéo v1.1.8 — hàng 34 xuống 26 pixel, bỏ ticker, bỏ footer, hero chỉ còn wordmark; mỗi bước là một lần thu nhỏ khung, không phải một lần cuộn (hoạt họa SMIL)">
  <defs>
    <linearGradient id="nsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2422"/><stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="nsGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a81c"/><stop offset="0.5" stop-color="#ffd977"/><stop offset="1" stop-color="#f5a81c"/>
    </linearGradient>
    <marker id="nsArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2bb48c"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#nsBg)"/>
  <rect x="1" y="1" width="1198" height="398" rx="14" fill="none" stroke="#123f38" stroke-width="2"/>

  <text x="34" y="34" font-family="'Arial Black',Bungee,sans-serif" font-weight="900" font-size="15" letter-spacing="3" fill="#fdf3e0">BỐN MỨC TIẾT KIỆM — KHÔNG MỨC NÀO LÀ CUỘN</text>
  <text x="34" y="52" font-family="system-ui,sans-serif" font-size="9" fill="#7d9d94">scene + reserve = chiều cao cửa sổ, ở mọi mức. Đó là bất biến duy nhất của vòng 3.</text>

  <!-- four stages -->
  <g font-family="system-ui,sans-serif">
    <!-- 1: full -->
    <g transform="translate(34,72)">
      <rect width="256" height="286" rx="8" fill="#0b2a28" stroke="#166153" stroke-width="1.4"/>
      <text x="12" y="18" font-size="7.5" letter-spacing="2" fill="#3f8177">01 · ĐẦY ĐỦ</text>
      <text x="12" y="30" font-size="7" fill="#2bb48c">≥ 840px · hàng 34px</text>

      <rect x="12" y="40" width="232" height="64" rx="3" fill="#0d2f2b" stroke="#1c6b5c"/>
      <text x="128" y="58" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="10" fill="#fdf3e0">LỌ</text>
      <text x="128" y="76" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="15" fill="url(#nsGold)">CHÉO</text>
      <text x="128" y="92" text-anchor="middle" font-size="6" fill="#4f7a70">wordmark + tagline + mascot + deck</text>

      <g>
        <rect x="12" y="112" width="110" height="18" rx="2" fill="#0f3d36"/><text x="18" y="124" font-size="6.5" fill="#d9f2c8">CHƠI NGAY</text>
        <rect x="12" y="134" width="110" height="18" rx="2" fill="#0f3d36"/><text x="18" y="146" font-size="6.5" fill="#d9f2c8">CHẾ ĐỘ</text>
        <rect x="12" y="156" width="110" height="18" rx="2" fill="#0f3d36"/><text x="18" y="168" font-size="6.5" fill="#d9f2c8">THÀNH TỰU</text>
        <rect x="12" y="178" width="110" height="18" rx="2" fill="#0f3d36"/><text x="18" y="190" font-size="6.5" fill="#d9f2c8">CÀI ĐẶT</text>
      </g>
      <g>
        <rect x="134" y="112" width="110" height="18" rx="2" fill="#0f3d36"/><text x="140" y="124" font-size="6.5" fill="#d9f2c8">TÁC GIẢ</text>
        <rect x="134" y="134" width="110" height="18" rx="2" fill="#0f3d36"/><text x="140" y="146" font-size="6.5" fill="#d9f2c8">CHANGELOG</text>
        <rect x="134" y="156" width="110" height="18" rx="2" fill="#e63b2e"/><text x="140" y="168" font-size="6.5" fill="#fdf3e0">THOÁT</text>
      </g>
      <rect x="12" y="202" width="232" height="12" rx="2" fill="#0f3d36" opacity="0.6"/>
      <text x="128" y="211" text-anchor="middle" font-size="5.5" fill="#8cc63f">footer ✓7/16 · v1.1.8</text>
      <rect x="12" y="220" width="232" height="16" rx="2" fill="#071c1a" stroke="#123f38"/>
      <text x="128" y="231" text-anchor="middle" font-size="5.5" fill="#f5a81c">ticker: CÀ PHÁO +10 · ỚT +15 · …</text>
      <text x="128" y="252" text-anchor="middle" font-size="6.5" fill="#8cc63f" font-weight="700">reserve 378 + scene 342</text>
      <text x="128" y="264" text-anchor="middle" font-size="6.5" fill="#4f7a70">= 720 · không cuộn</text>
    </g>

    <!-- 2: tight rows -->
    <g transform="translate(320,92)">
      <rect width="256" height="266" rx="8" fill="#0b2a28" stroke="#166153" stroke-width="1.4"/>
      <text x="12" y="18" font-size="7.5" letter-spacing="2" fill="#3f8177">02 · HÀNG 26px</text>
      <text x="12" y="30" font-size="7" fill="#2bb48c">giữ đủ MỌI nút · tiết kiệm 56px</text>
      <rect x="12" y="40" width="232" height="56" rx="3" fill="#0d2f2b" stroke="#1c6b5c"/>
      <text x="128" y="62" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="13" fill="url(#nsGold)">CHÉO</text>
      <text x="128" y="82" text-anchor="middle" font-size="6" fill="#4f7a70">hero 220px (squeeze)</text>
      <g>
        <rect x="12" y="104" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="114" font-size="6" fill="#d9f2c8">CHƠI NGAY</text>
        <rect x="12" y="122" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="132" font-size="6" fill="#d9f2c8">CHẾ ĐỘ</text>
        <rect x="12" y="140" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="150" font-size="6" fill="#d9f2c8">BẢNG XH</text>
        <rect x="12" y="158" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="168" font-size="6" fill="#d9f2c8">THÀNH TỰU</text>
        <rect x="12" y="176" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="186" font-size="6" fill="#d9f2c8">CÁCH CHƠI</text>
        <rect x="12" y="194" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="204" font-size="6" fill="#d9f2c8">CÀI ĐẶT</text>
      </g>
      <g>
        <rect x="134" y="104" width="110" height="14" rx="2" fill="#0f3d36"/><text x="140" y="114" font-size="6" fill="#d9f2c8">TÁC GIẢ</text>
        <rect x="134" y="122" width="110" height="14" rx="2" fill="#0f3d36"/><text x="140" y="132" font-size="6" fill="#d9f2c8">CHANGELOG</text>
        <rect x="134" y="140" width="110" height="14" rx="2" fill="#e63b2e"/><text x="140" y="150" font-size="6" fill="#fdf3e0">THOÁT</text>
      </g>
      <rect x="12" y="216" width="232" height="14" rx="2" fill="#071c1a" stroke="#123f38"/>
      <text x="128" y="226" text-anchor="middle" font-size="5.5" fill="#f5a81c">ticker vẫn còn</text>
      <text x="128" y="246" text-anchor="middle" font-size="6.5" fill="#8cc63f" font-weight="700">reserve 330 + scene 238</text>
      <text x="128" y="258" text-anchor="middle" font-size="6.5" fill="#4f7a70">= 568 · không cuộn</text>
    </g>

    <!-- 3: no ticker -->
    <g transform="translate(606,102)">
      <rect width="256" height="256" rx="8" fill="#0b2a28" stroke="#2bb48c" stroke-width="1.4"/>
      <text x="12" y="18" font-size="7.5" letter-spacing="2" fill="#2bb48c">03 · BỎ TICKER</text>
      <text x="12" y="30" font-size="7" fill="#2bb48c">trang trí, có lại trong modal</text>
      <rect x="12" y="40" width="232" height="52" rx="3" fill="#0d2f2b" stroke="#1c6b5c"/>
      <text x="128" y="62" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="13" fill="url(#nsGold)">CHÉO</text>
      <text x="128" y="80" text-anchor="middle" font-size="6" fill="#4f7a70">hero 146px</text>
      <g>
        <rect x="12" y="100" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="110" font-size="6" fill="#d9f2c8">CHƠI NGAY</text>
        <rect x="12" y="118" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="128" font-size="6" fill="#d9f2c8">CHẾ ĐỘ</text>
        <rect x="12" y="136" width="110" height="14" rx="2" fill="#0f3d36"/><text x="18" y="146" font-size="6" fill="#d9f2c8">CÀI ĐẶT</text>
      </g>
      <g>
        <rect x="134" y="100" width="110" height="14" rx="2" fill="#0f3d36"/><text x="140" y="110" font-size="6" fill="#d9f2c8">TÁC GIẢ</text>
        <rect x="134" y="118" width="110" height="14" rx="2" fill="#e63b2e"/><text x="140" y="128" font-size="6" fill="#fdf3e0">THOÁT</text>
      </g>
      <text x="128" y="172" text-anchor="middle" font-size="6" fill="#3f8177">ticker: KHÔNG render</text>
      <text x="128" y="200" text-anchor="middle" font-size="6.5" fill="#8cc63f" font-weight="700">reserve 300 + scene 220</text>
      <text x="128" y="212" text-anchor="middle" font-size="6.5" fill="#4f7a70">= 520</text>
    </g>

    <!-- 4: minimal -->
    <g transform="translate(892,112)">
      <rect width="274" height="246" rx="8" fill="#0b2a28" stroke="#f5a81c" stroke-width="1.6"/>
      <text x="12" y="18" font-size="7.5" letter-spacing="2" fill="#f5a81c">04 · CHỈ WORDMARK</text>
      <text x="12" y="30" font-size="7" fill="#f5a81c">điện thoại nằm ngang · 390px</text>
      <rect x="12" y="40" width="250" height="46" rx="3" fill="#0d2f2b" stroke="#f5a81c" stroke-opacity="0.5"/>
      <text x="137" y="60" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="9" fill="#fdf3e0">LỌ</text>
      <text x="137" y="78" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="14" fill="url(#nsGold)">CHÉO</text>
      <g>
        <rect x="12" y="94" width="120" height="14" rx="2" fill="#0f3d36"/><text x="18" y="104" font-size="6" fill="#d9f2c8">CHƠI NGAY</text>
        <rect x="12" y="112" width="120" height="14" rx="2" fill="#0f3d36"/><text x="18" y="122" font-size="6" fill="#d9f2c8">CÀI ĐẶT</text>
        <rect x="142" y="94" width="120" height="14" rx="2" fill="#0f3d36"/><text x="148" y="104" font-size="6" fill="#d9f2c8">TÁC GIẢ</text>
        <rect x="142" y="112" width="120" height="14" rx="2" fill="#e63b2e"/><text x="148" y="122" font-size="6" fill="#fdf3e0">THOÁT</text>
      </g>
      <text x="137" y="146" text-anchor="middle" font-size="6" fill="#3f8177">tagline · mascot · deck · ticker · footer: tắt</text>
      <text x="137" y="176" text-anchor="middle" font-size="6.5" fill="#f5a81c" font-weight="700">reserve 244 + scene 146</text>
      <text x="137" y="188" text-anchor="middle" font-size="6.5" fill="#4f7a70">= 390 · vừa đúng, không cuộn</text>
    </g>

    <!-- arrows between stages -->
    <g stroke="#2bb48c" stroke-width="1.4" fill="none" marker-end="url(#nsArrow)">
      <line x1="292" y1="222" x2="316" y2="222"/>
      <line x1="578" y1="222" x2="602" y2="222"/>
      <line x1="864" y1="222" x2="888" y2="222"/>
    </g>
  </g>

  <text x="34" y="382" font-family="system-ui,sans-serif" font-size="7.5" fill="#5c7d74">Thứ tự hy sinh: chiều cao hàng → ticker → footer → thân hero. Không mức nào chạm vào nút bấm, vì một menu có nút ngoài màn hình là menu hỏng.</text>
</svg>
