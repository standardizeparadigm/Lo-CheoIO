<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img"
     aria-label="Vì sao LỌ bị cắt: hero căn giữa đẩy nội dung ra cả hai phía, hero neo đỉnh thì không">
  <defs>
    <linearGradient id="wcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a35"/><stop offset="0.55" stop-color="#092723"/><stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="wcGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f5a81c"/>
    </linearGradient>
    <linearGradient id="wcRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a4d"/><stop offset="1" stop-color="#e63b2e"/>
    </linearGradient>
    <clipPath id="wcClipL"><rect x="0" y="0" width="1200" height="380"/></clipPath>
  </defs>

  <rect width="1200" height="380" fill="url(#wcBg)"/>
  <rect width="1200" height="380" fill="none" stroke="#166153" stroke-width="3"/>

  <text x="600" y="46" text-anchor="middle" font-family="Bungee, ui-sans-serif" font-size="26" fill="#ffc94a" letter-spacing="3">
    VÌ SAO LỌ BỊ CẮT
  </text>
  <text x="600" y="72" text-anchor="middle" font-family="ui-sans-serif" font-size="13" fill="#8fb3a8" letter-spacing="1.5">
    cùng một band cao cố định · hai cách đặt nội dung vào
  </text>

  <!-- ============ LEFT: justify-center (broken) ============ -->
  <g transform="translate(40,100)">
    <text x="270" y="0" text-anchor="middle" font-family="ui-sans-serif" font-size="12" font-weight="700" fill="#ff6a4d" letter-spacing="2.5">
      TRƯỚC · justify-center
    </text>

    <!-- the fixed-height band -->
    <rect x="30" y="18" width="480" height="180" fill="#0b2a28" stroke="#166153" stroke-width="2"/>

    <!-- content taller than the band, spilling out both ends -->
    <g clip-path="none">
      <!-- overflow above the band: clipped by the outer column -->
      <text x="270" y="28" text-anchor="middle" font-family="Bungee, ui-sans-serif" font-size="54" fill="url(#wcGold)" stroke="#b81f22" stroke-width="3" paint-order="stroke">LỌ</text>
      <text x="270" y="92" text-anchor="middle" font-family="Bungee, ui-sans-serif" font-size="46" fill="url(#wcRed)" stroke="#061a1a" stroke-width="3" paint-order="stroke">CHÉO</text>
      <text x="270" y="130" text-anchor="middle" font-family="ui-sans-serif" font-size="11" fill="#b9d0c7">tagline · ba dòng văn xuôi</text>
      <rect x="150" y="142" width="240" height="24" fill="#10403a" stroke="#1c8a6f" stroke-width="1.5"/>
      <text x="270" y="158" text-anchor="middle" font-family="ui-sans-serif" font-size="10" fill="#7fd0b4">deck · mode · thử thách · tip</text>
    </g>

    <!-- the cut, drawn as a hard edge over the top of the band -->
    <rect x="0" y="0" width="540" height="18" fill="#092723"/>
    <line x1="0" y1="18" x2="540" y2="18" stroke="#ff6a4d" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="540" y="10" text-anchor="end" font-family="ui-sans-serif" font-size="10" fill="#ff9d8a">↑ nửa trên của LỌ bị cắt</text>

    <!-- spill below the band -->
    <rect x="30" y="198" width="480" height="26" fill="#061a1a" stroke="#e63b2e" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="270" y="215" text-anchor="middle" font-family="ui-sans-serif" font-size="10" fill="#ff9d8a">phần tràn đi xuống — deck bị đẩy khỏi band</text>

    <text x="270" y="252" text-anchor="middle" font-family="ui-sans-serif" font-size="11" fill="#8fb3a8">lỗi ở CẢ HAI đầu</text>
  </g>

  <!-- ============ RIGHT: justify-start (fixed) ============ -->
  <g transform="translate(640,100)">
    <text x="270" y="0" text-anchor="middle" font-family="ui-sans-serif" font-size="12" font-weight="700" fill="#2bb48c" letter-spacing="2.5">
      SAU · justify-start
    </text>

    <rect x="30" y="18" width="480" height="180" fill="#0b2a28" stroke="#1c8a6f" stroke-width="2"/>

    <!-- anchored to the top: nothing can be above the band -->
    <text x="270" y="74" text-anchor="middle" font-family="Bungee, ui-sans-serif" font-size="54" fill="url(#wcGold)" stroke="#b81f22" stroke-width="3" paint-order="stroke">LỌ</text>
    <text x="270" y="128" text-anchor="middle" font-family="Bungee, ui-sans-serif" font-size="46" fill="url(#wcRed)" stroke="#061a1a" stroke-width="3" paint-order="stroke">CHÉO</text>

    <!-- the top edge is now a plain boundary, not a cut -->
    <line x1="30" y1="18" x2="510" y2="18" stroke="#2bb48c" stroke-width="3"/>
    <text x="540" y="10" text-anchor="end" font-family="ui-sans-serif" font-size="10" fill="#7fd0b4">đỉnh band = đỉnh chữ</text>

    <!-- what gives is the deck, which is decoration -->
    <rect x="30" y="198" width="480" height="26" fill="#061a1a" stroke="#166153" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="270" y="215" text-anchor="middle" font-family="ui-sans-serif" font-size="10" fill="#7fd0b4">phần tràn đi xuống — chỗ nhường là deck</text>

    <text x="270" y="252" text-anchor="middle" font-family="ui-sans-serif" font-size="11" fill="#8fb3a8">LỌ không thể bị cắt</text>
  </g>

  <!-- animated sweep proving the two are the same band -->
  <rect x="70" y="118" width="480" height="180" fill="none" stroke="#ffc94a" stroke-width="2" opacity="0.0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
