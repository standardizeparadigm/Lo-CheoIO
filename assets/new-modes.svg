<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-label="New in v1.1.4 — Combo Festival (combo window ×2) and Grand Feast (jar bonus ×2.5)">
  <defs>
    <radialGradient id="nmGlowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8ad4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff8ad4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nmGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="230" rx="16" fill="#061a1a"/>
  <rect width="1200" height="230" rx="16" fill="none" stroke="#123f38" stroke-width="2"/>
  <text x="600" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="11" letter-spacing="6" fill="#2bb48c">— NEW IN v1.1.4 · 2 NEW MODES —</text>

  <!-- Combo Festival card -->
  <circle cx="315" cy="125" r="130" fill="url(#nmGlowA)">
    <animate attributeName="r" values="110;145;110" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(85 52)">
    <rect width="460" height="150" rx="16" fill="#260a1f" stroke="#ff8ad4" stroke-width="3"/>
    <rect width="460" height="150" rx="16" fill="#ff8ad4" opacity="0.12">
      <animate attributeName="opacity" values="0.06;0.3;0.06" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <path d="M46 62 L24 112 L46 112 L38 146 L70 94 L47 94 L58 62 Z" fill="#ff8ad4" opacity="0.9">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <text x="92" y="52" font-family="'Bungee','Arial Black',sans-serif" font-size="26" fill="#ff8ad4">COMBO FESTIVAL</text>
    <text x="92" y="78" font-family="'Be Vietnam Pro',sans-serif" font-weight="700" font-size="13" fill="#fdf3e0">LỄ HỘI COMBO · LỄ HỘI CỦA DÂY CHUỖI</text>
    <text x="92" y="104" font-family="'Courier New',monospace" font-size="12" letter-spacing="1" fill="#ffb3de">×1.15 SCORE · COMBO WINDOW ×2 (5.4s)</text>
    <text x="92" y="128" font-family="'Courier New',monospace" font-size="11" fill="#ff8ad4" opacity="0.85">giữ nhịp — multiplier nhảy như pháo bông</text>
  </g>

  <!-- Grand Feast card -->
  <circle cx="885" cy="125" r="130" fill="url(#nmGlowB)">
    <animate attributeName="r" values="145;110;145" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(655 52)">
    <rect width="460" height="150" rx="16" fill="#052422" stroke="#5eead4" stroke-width="3"/>
    <rect width="460" height="150" rx="16" fill="#5eead4" opacity="0.12">
      <animate attributeName="opacity" values="0.06;0.3;0.06" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <g stroke="#5eead4" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M26 128 H78"/>
      <path d="M32 128 a22 22 0 0 1 44 0" fill="#5eead4" fill-opacity="0.22"/>
      <path d="M54 106 V96 M44 96 H64"/>
    </g>
    <text x="98" y="52" font-family="'Bungee','Arial Black',sans-serif" font-size="26" fill="#5eead4">GRAND FEAST</text>
    <text x="98" y="78" font-family="'Be Vietnam Pro',sans-serif" font-weight="700" font-size="13" fill="#fdf3e0">ĐẠI TIỆC DƯA · TRẨY HỘI MUỐI DƯA</text>
    <text x="98" y="104" font-family="'Courier New',monospace" font-size="12" letter-spacing="1" fill="#a7f3e7">×0.6 SCORE · JAR BONUS ×2.5 · DENSE RAIN</text>
    <text x="98" y="128" font-family="'Courier New',monospace" font-size="11" fill="#5eead4" opacity="0.85">chơi kiểu trồng lúa — đổ thật nhiều hũ</text>
  </g>
</svg>
