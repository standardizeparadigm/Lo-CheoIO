  </g>

  <g font-family="system-ui,sans-serif" font-size="9" fill="#7d9d94">
    <circle cx="48" cy="316" r="4" fill="#f5a81c"/><text x="58" y="319">gameplay 96</text>
    <circle cx="168" cy="316" r="4" fill="#2bb48c"/><text x="178" y="319">i18n 42</text>
    <circle cx="268" cy="316" r="4" fill="#9d6bff"/><text x="278" y="319">ui · layout 82</text>
    <circle cx="408" cy="316" r="4" fill="#8cc63f"/><text x="418" y="319">storage · settings 88</text>
  </g>
  <text x="1160" y="319" text-anchor="end" font-family="system-ui,sans-serif" font-size="8.5" fill="#166153">tests/ · 36 files</text>
</svg>
