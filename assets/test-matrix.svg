      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="#0b2a28"/>
      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="#9d6bff"/>
      <circle cx="256" cy="34" r="3.5" fill="#9d6bff"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(910,142)">
      <rect width="270" height="46" rx="4" fill="url(#tmCard)" stroke="#166153" stroke-width="1.4"/>
      <text x="12" y="19" font-size="10.5" fill="#d9f2c8" font-weight="700">vite build</text>
      <text x="12" y="33" font-size="8.5" fill="#7d9d94">845 KB · gzip 392 KB</text>
      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="#0b2a28"/>
      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="url(#tmBar)">
        <animate attributeName="opacity" values="0.6;1;1;0.6" dur="9s" begin="4.2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="256" cy="34" r="3.5" fill="#8cc63f"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.1s" repeatCount="indefinite"/></circle>
