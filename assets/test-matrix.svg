      <circle cx="256" cy="34" r="3.5" fill="#8cc63f"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>

    <g transform="translate(40,142)">
