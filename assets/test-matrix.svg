    <g transform="translate(40,200)">
      <rect width="270" height="46" rx="4" fill="url(#tmCard)" stroke="#ffc94a" stroke-width="1.4"/>
      <text x="12" y="19" font-size="10.5" fill="#d9f2c8" font-weight="700">layout sim</text>
      <text x="12" y="33" font-size="8.5" fill="#7d9d94">7 rows fit 318px exactly</text>
      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="#0b2a28"/>
      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="#ffc94a"/>
      <circle cx="256" cy="34" r="3.5" fill="#ffc94a"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.4s" repeatCount="indefinite"/></circle>
