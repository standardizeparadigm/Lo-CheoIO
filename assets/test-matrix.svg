      <circle cx="256" cy="34" r="3.5" fill="#8cc63f"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(620,142)">
      <rect width="270" height="46" rx="4" fill="url(#tmCard)" stroke="#9d6bff" stroke-width="1.4"/>
      <text x="12" y="19" font-size="10.5" fill="#d9f2c8" font-weight="700">probe-menu-layout</text>
