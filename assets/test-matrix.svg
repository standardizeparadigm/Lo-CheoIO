<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Ma trận kiểm thử Lọ Chéo v1.1.8 — 308 test trên 36 file, 9 cổng kiểm tra, phân bố theo nhóm (hoạt họa SMIL)">
  <defs>
    <!-- Round 6: one reusable bloom. Every asset now has a light source —
         before this, twelve of the twenty had gradients but not a single
         filter, so the highlights were flat fills pretending to glow. -->
    <filter id="tm-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="tmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2422"/>
      <stop offset="1" stop-color="#061a1a"/>
    </linearGradient>
    <linearGradient id="tmCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f322c"/>
      <stop offset="1" stop-color="#0a2422"/>
    </linearGradient>
    <linearGradient id="tmBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb48c"/>
      <stop offset="1" stop-color="#8cc63f"/>
    </linearGradient>
    <linearGradient id="tmBig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6e07a"/>
      <stop offset="1" stop-color="#8cc63f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#tmBg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="16" fill="none" stroke="#123f38" stroke-width="2"/>

  <text x="40" y="38" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="19" letter-spacing="3" fill="#fdf3e0">TEST MATRIX <tspan fill="#f5a81c">v1.1.8</tspan></text>
  <text x="40" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#7d9d94">308 tests · 36 files · 9 gates · all green before release</text>

  <!-- con số lớn -->
  <text x="1160" y="52" text-anchor="end" font-family="'Arial Black','Bungee',sans-serif" font-weight="900" font-size="52" fill="url(#tmBig)" letter-spacing="2">308</text>
  <text x="1160" y="72" text-anchor="end" font-family="system-ui,sans-serif" font-size="9" letter-spacing="2.5" fill="#2bb48c">PASSING</text>

  <!-- chín thẻ cổng -->
  <g font-family="system-ui,sans-serif">
    <g transform="translate(40,84)">
      <rect width="270" height="46" rx="4" fill="url(#tmCard)" stroke="#166153" stroke-width="1.4"/>
      <text x="12" y="19" font-size="10.5" fill="#d9f2c8" font-weight="700">tsc --noEmit</text>
      <text x="12" y="33" font-size="8.5" fill="#7d9d94">no type errors</text>
      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="#0b2a28"/>
      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="url(#tmBar)">
        <animate attributeName="opacity" values="0.6;1;1;0.6" dur="9s" repeatCount="indefinite"/>
      </rect>
      <circle cx="256" cy="34" r="3.5" fill="#8cc63f"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(330,84)">
      <rect width="270" height="46" rx="4" fill="url(#tmCard)" stroke="#166153" stroke-width="1.4"/>
      <text x="12" y="19" font-size="10.5" fill="#d9f2c8" font-weight="700">vitest run</text>
      <text x="12" y="33" font-size="8.5" fill="#7d9d94">308 / 308 · 36 files</text>
      <rect x="170" y="14" width="88" height="7" rx="3.5" fill="#0b2a28"/>
