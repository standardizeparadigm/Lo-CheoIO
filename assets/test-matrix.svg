  <!-- phân bố 308 test -->
  <text x="40" y="266" font-family="system-ui,sans-serif" font-size="9.5" letter-spacing="1" fill="#7d9d94">WHERE THE 308 TESTS LIVE</text>
  <g transform="translate(40,274)">
    <rect width="1120" height="22" rx="11" fill="#0b2a28"/>
    <!-- gameplay 96 -->
    <rect x="0" y="0" width="349" height="22" fill="#f5a81c"><animate attributeName="opacity" values="0.55;1;1;0.55" dur="9s" begin="0s" repeatCount="indefinite"/></rect>
    <!-- i18n 46 -->
    <rect x="349" y="0" width="153" height="22" fill="#2bb48c"><animate attributeName="opacity" values="0.55;1;1;0.55" dur="9s" begin="0.8s" repeatCount="indefinite"/></rect>
